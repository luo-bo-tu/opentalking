<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (() => {
        const path = window.location.pathname;
        const parts = path.split("/").filter(Boolean);
        const isPortProxyPath =
          parts.length >= 2
          && parts[parts.length - 2] === "proxy"
          && /^[0-9]+$/.test(parts[parts.length - 1]);
        if (isPortProxyPath && !path.endsWith("/")) {
          window.location.replace(`${path}/${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/qiepai-logo.png" />
    <meta name="description" content="企鹅派 qiepai - 企业数字人 IP 框架" />
    <meta property="og:title" content="企鹅派 qiepai" />
    <meta property="og:description" content="企业数字人 IP 框架，基于 OpenTalking 二次开发" />
    <meta property="og:image" content="/qiepai-logo.png" />
    <title>企鹅派·企业数字人</title>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
